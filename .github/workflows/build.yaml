name: build from source

on:
  push:
    paths:
      - .github/workflows/build.yaml
      - build/*
      - VERSION
  pull_request:
  workflow_dispatch:

env:
  DOCKERHUB_REPO: dancwilliams/protonmail-bridge
  GHCR_REPO: ghcr.io/dancwilliams/protonmail-bridge-docker
  DOCKER_REPO_DEV: ghcr.io/dancwilliams/protonmail-bridge
  PLATFORMS: linux/amd64,linux/arm64/v8,linux/riscv64

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - '.github/workflows/build.yaml'
              - 'build/**'
              - 'VERSION'

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set version
        run: echo "version=$(cat VERSION)" >> $GITHUB_ENV

      - name: Sanitize ref for Docker tag
        run: echo "SAFE_TAG=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-')" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_REPO_DEV }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          labels: ${{ steps.meta.outputs.labels }}
          context: ./build
          file: ./build/Dockerfile
          tags: "${{ env.DOCKER_REPO_DEV }}:dev-${{ env.SAFE_TAG }}"
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            version=${{ env.version }}

      - name: Verify provenance attestation
        run: docker buildx imagetools inspect "${{ env.DOCKER_REPO_DEV }}:dev-${{ env.SAFE_TAG }}" --format '{{ json .Provenance }}'

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.DOCKER_REPO_DEV }}:dev-${{ env.SAFE_TAG }}"
          format: 'sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm  # native arm64 runner, no QEMU needed
          - platform: linux/riscv64
            runner: ubuntu-latest     # QEMU required; CGO compilation is slow
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # Base image digests live only in build/Dockerfile so Renovate keeps them
          # current. Never hard-code a digest here: a digest in this file is
          # invisible to Renovate and went six months stale once (Feb-Sep 2026).
          # debian:bookworm-slim has no riscv64 image; reuse the sid-slim digest
          # from the Dockerfile's build stage for that platform.
          if [ "$platform" = "linux/riscv64" ]; then
            image=$(grep -oE 'debian:sid-slim@sha256:[0-9a-f]{64}' build/Dockerfile | head -1)
          else
            image=$(grep -oE 'debian:bookworm-slim@sha256:[0-9a-f]{64}' build/Dockerfile | head -1)
          fi
          test -n "$image"
          echo "RUNTIME_IMAGE=$image" >> $GITHUB_ENV

      - name: Set version
        run: echo "version=$(cat VERSION)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_REPO }},push-by-digest=true,name-canonical=true,push=true
          context: ./build
          file: ./build/Dockerfile
          provenance: mode=max
          sbom: true
          build-args: |
            version=${{ env.version }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # revision below needs history back to the last VERSION bump

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # Container build revision: 1 for the commit that bumped VERSION, +1 for
      # every later commit that touched a build input (build/, this workflow).
      # Derived, not stored, so Renovate base-image bumps and other rebuilds of
      # the same upstream version get a fresh immutable tag without anyone
      # remembering to edit a file.
      - name: Set version
        run: |
          echo "version=$(cat VERSION)" >> $GITHUB_ENV
          base=$(git log -1 --format=%H -- VERSION)
          echo "revision=$(( $(git rev-list --count "$base"..HEAD -- build .github/workflows/build.yaml) + 1 ))" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tag scheme (see README "Tags"):
      #   v3.26.0-2  immutable: container build revision 2 of upstream v3.26.0
      #   v3.26.0    floating: latest revision of that upstream version
      #   latest     floating: newest of everything
      # VERSION is the upstream Proton Bridge tag and is only ever changed by the
      # update-check workflow. The revision is computed in "Set version" above, so
      # any rebuild of the same upstream version (entrypoint fix, base image bump,
      # dependency) gets a fresh immutable tag and its own release instead of
      # silently replacing the previous digest. Never invent an upstream-looking
      # number such as v3.26.1: it collides with Proton's own releases and breaks
      # the update-check comparison.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=${{ env.version }}
            type=raw,value=${{ env.version }}-${{ env.revision }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKERHUB_REPO }}@sha256:%s ' *)

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.DOCKERHUB_REPO }}:${{ env.version }}"
          format: 'sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_REPO }}:${{ env.version }}
          docker buildx imagetools inspect ${{ env.GHCR_REPO }}:${{ env.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="${{ env.version }}-${{ env.revision }}"
          # Skip if release already exists (e.g., workflow re-run)
          if gh release view "$release" &>/dev/null; then
            echo "Release $release already exists, skipping"
            exit 0
          fi

          # Fetch upstream release notes (best-effort)
          UPSTREAM_BODY=$(gh api repos/ProtonMail/proton-bridge/releases/tags/${{ env.version }} --jq '.body' 2>/dev/null || echo "")

          gh release create "$release" \
            --title "$release" \
            --notes "$(cat <<EOF
          Docker image for Proton Mail Bridge ${{ env.version }}, container build revision ${{ env.revision }}

          **Images:**
          - \`docker pull ${{ env.DOCKERHUB_REPO }}:$release\`
          - \`docker pull ${{ env.GHCR_REPO }}:$release\`
          - \`${{ env.version }}\` and \`latest\` now point at this build

          **Platforms:** linux/amd64, linux/arm64/v8, linux/riscv64

          ---

          <details><summary>Upstream release notes</summary>

          ${UPSTREAM_BODY:-See https://github.com/ProtonMail/proton-bridge/releases/tag/${{ env.version }}}

          </details>
          EOF
          )"

  ci-required:
    if: ${{ failure() || cancelled() }}
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
