services:
  protonmail-bridge:
    image: dancwilliams/protonmail-bridge:latest@sha256:7c39f048600689fcbb3303300ff6c569b09b85a6963cadf97c0b720ce5bc3ea4
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root
    # Optional: set a passphrase to encrypt the GPG keyring (see README)
    # environment:
    #   - KEYRING_PASSPHRASE=your-passphrase-here

volumes:
  protonmail:
    name: protonmail
