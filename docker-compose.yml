services:
  protonmail-bridge:
    image: dancwilliams/protonmail-bridge:latest@sha256:9d3900508ce5b14e24d5aa3a0c3b631e2a15d930e4ba1001fffe2ce2a3332963
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root
    # Optional: set a passphrase to encrypt the GPG keyring (see README)
    # environment:
    #   - KEYRING_PASSPHRASE=your-passphrase-here

volumes:
  protonmail:
    name: protonmail
