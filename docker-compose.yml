services:
  protonmail-bridge:
    image: dancwilliams/protonmail-bridge:latest@sha256:d472e2c76b72c8169bd2a081d05993c37c196a67a2b0141503ffb323f7353f0c
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root
    # Optional: set a passphrase to encrypt the GPG keyring (see README)
    # environment:
    #   - KEYRING_PASSPHRASE=your-passphrase-here

volumes:
  protonmail:
    name: protonmail
