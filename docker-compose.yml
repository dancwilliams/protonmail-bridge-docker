services:
  protonmail-bridge:
    image: dancwilliams/protonmail-bridge:latest@sha256:bad432cb480471f2e811ddafa270aa5c5235eddef55752e23998954cc54da1b1
    ports:
      - 1025:25/tcp
      - 1143:143/tcp
    restart: unless-stopped
    volumes:
      - protonmail:/root
    # Optional: set a passphrase to encrypt the GPG keyring (see README)
    # environment:
    #   - KEYRING_PASSPHRASE=your-passphrase-here

volumes:
  protonmail:
    name: protonmail
